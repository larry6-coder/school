<style>

@media(prefers-color-scheme:dark){:root{--nav:#0b1a33;--acc:#6ea2ff;--bg:#0e1626;--card:#16213a;--ln:#2a3a5a;--txt:#e7edf8;--bad:#ff8a80;--big:#8db6ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

label{display:block;margin:.6rem 0;font-weight:bold}

.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}

td input{width:5.5em;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.tile,.panel{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:.9rem 1rem}
.tile small{display:block;opacity:.7;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}.tile b{font-size:2.2rem;line-height:1.1}
.panel{margin:1rem 0}.panel h2{margin-top:0}

.bar{height:.8rem;background:var(--acc);border-radius:3px}
.msg{background:var(--sun);color:#10302b;padding:.6rem .8rem;border-radius:6px}.bad{color:var(--bad);margin:.2rem 0}
.edit{border-left:4px solid var(--sun);padding-left:1rem;margin:1rem 0}
.login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--nav),var(--acc))}
.lbox{background:var(--card);width:100%;max-width:400px;border-radius:12px;padding:1.5rem}
.lbox h1{text-align:center;margin:.3rem 0 0}.sub,.c{text-align:center}.sub{margin:0 0 .5rem;opacity:.7}
.ic{width:72px;height:72px;margin:-3rem auto .3rem;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center}
@media(max-width:700px){.app{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;padding:.6rem}aside b{padding:.4rem .6rem}aside .sp{margin-top:0;margin-left:auto}}
@media print{aside,button,select,.np,.msg{display:none!important}.app{display:block}main{max-width:none;padding:0}body{background:#fff;color:#000}.pos b{color:#000}}
@media(prefers-reduced-motion:no-preference){.bar{transition:width .4s}}

const SB_URL="https://uhezseayboktngjbmwgk.supabase.co/rest/v1/",SB_KEY="sb_publishable_HQNxuUziy3e1eoj1E4joMw_jeZVfolS";   // Supabase > Project Settings > API: Project URL and anon (publishable) key
const SCHOOL="Grace Harvest Academy",START="07:30";

en:{idlab:"Email, phone number or special ID",fmt:"Excel columns: Adm, Name, then one column per subject (Total and Position are optional).",nf2:"That is not one of your classes.",attn:"Attendance",pres:"Present",abs:"Absent",latee:"Late",allp:"All present",alla:"All absent",date:"Date",classes:"Classes",ctch:"Class teacher",room:"Room",cap:"Capacity",gn:"Guardian",gp:"Guardian phone",search:"Search (press Enter)",sure:"Delete this record?",rep:"Report card",prt:"Print report card",att_t:"Present today",dash:"Dashboard",cnt_l:"Total learners",cnt_c:"Classes",cnt_t:"Teachers",late_t:"Late today",byc:"By class",view:"View",app:"School Portal",login:"Log in",register:"Create account",email:"Email",pw:"Password",out:"Log out",upload:"Upload marks",learners:"Learners",teachers:"Teachers",myc:"My classes",cls:"Class",term:"Term",file:"Excel file (.xlsx)",check:"Check file",confirm:"Save to school records",adm:"Admission no.",name:"Name",code:"Special ID",add:"Add learner",save:"Save",edit:"Edit",marks:"Marks",total:"Total",pos:"Position",of:"out of",acad:"Academic progress",phys:"Physical progress",mind:"Mental wellbeing",late:"Late arrivals",none:"Nothing recorded yet.",link:"Link your child",linkhelp:"Enter the special ID you got from the school (example 1042-K7P3Q).",subj:"Class and subject",assign:"Teaching (Class:Subject, Class:Subject)",clock:"Clock in",ok:"Saved.",bad:"Problems found (these rows are skipped)",trend:"Total by term",up:"Improving",down:"Dropped",same:"Steady",lang:"Kiswahili",min:"min late",addt:"Add teacher",rows:"learners ready",lateadd:"Log late arrival",mins:"Minutes late",need:"Class, term and file are required.",nf:"Not found. Check the number and code."},
sw:{idlab:"Barua pepe, namba ya simu au kitambulisho maalum",fmt:"Safu za Excel: Adm, Name, kisha safu moja kwa kila somo (Total na Position si lazima).",nf2:"Hili si darasa lako.",attn:"Mahudhurio",pres:"Yupo",abs:"Hayupo",latee:"Amechelewa",allp:"Wote wapo",alla:"Wote hawapo",date:"Tarehe",classes:"Madarasa",ctch:"Mwalimu wa darasa",room:"Chumba",cap:"Uwezo",gn:"Mlezi",gp:"Simu ya mlezi",search:"Tafuta (bonyeza Enter)",sure:"Futa rekodi hii?",rep:"Kadi ya matokeo",prt:"Chapisha kadi ya matokeo",att_t:"Waliopo leo",dash:"Dashibodi",cnt_l:"Jumla ya wanafunzi",cnt_c:"Madarasa",cnt_t:"Walimu",late_t:"Waliochelewa leo",byc:"Kwa darasa",view:"Angalia",app:"Mfumo wa Shule",login:"Ingia",register:"Fungua akaunti",email:"Barua pepe",pw:"Nenosiri",out:"Toka",upload:"Pakia alama",learners:"Wanafunzi",teachers:"Walimu",myc:"Madarasa yangu",cls:"Darasa",term:"Muhula",file:"Faili ya Excel (.xlsx)",check:"Kagua faili",confirm:"Hifadhi kwenye rekodi za shule",adm:"Namba ya usajili",name:"Jina",code:"Kitambulisho maalum",add:"Ongeza mwanafunzi",save:"Hifadhi",edit:"Hariri",marks:"Alama",total:"Jumla",pos:"Nafasi",of:"kati ya",acad:"Maendeleo ya masomo",phys:"Maendeleo ya mwili",mind:"Ustawi wa akili",late:"Kuchelewa",none:"Hakuna rekodi bado.",link:"Unganisha mtoto wako",linkhelp:"Weka kitambulisho maalum ulichopewa na shule (mfano 1042-K7P3Q).",subj:"Darasa na somo",assign:"Anachofundisha (Darasa:Somo, Darasa:Somo)",clock:"Weka alama ya kufika",ok:"Imehifadhiwa.",bad:"Matatizo yamepatikana (safu hizi zimeachwa)",trend:"Jumla kwa muhula",up:"Anaboresha",down:"Ameshuka",same:"Thabiti",lang:"English",min:"dak. kuchelewa",addt:"Ongeza mwalimu",rows:"wanafunzi tayari",lateadd:"Rekodi kuchelewa",mins:"Dakika za kuchelewa",need:"Darasa, muhula na faili vinahitajika.",nf:"Haijapatikana. Angalia namba na msimbo."}};
let L=localStorage.lang||"en";const t=k=>T[L][k]||T.en[k]||k;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=s=>String(s).trim().replace(/\W+/g,"_"),dsp=s=>String(s).replace(/_/g," ");
const gr=p=>p>=90?"A+":p>=80?"A":p>=70?"B":p>=60?"C":p>=50?"D":"F";
const rc=()=>{let c;do{c=[...crypto.getRandomValues(new Uint8Array(5))].map(x=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[x%31]).join("")}while(!/[A-Z]/.test(c));return c};
const today=()=>new Date().toISOString().slice(0,10);
const DOM="@parent.school.app",kind=v=>v.includes("@")?"email":/^[\d\s+()-]{7,}$/.test(v)?"phone":"id";
const mail=v=>{v=v.trim();const k=kind(v);return k=="email"?v.toLowerCase():(k=="phone"?"p"+v.replace(/\D/g,""):"id"+v.toLowerCase().replace(/[^\w-]/g,""))+DOM};
const S={classes:[],ac:"",ad:"",q:"",u:null,role:null,tab:null,learners:[],teachers:[],sheet:null,msg:"",edit:null,term:"",ai:0,me:null};
let auth,db,sb;
function ranks(a){const s=[...a].sort((x,y)=>y.total-x.total);let p=0,last=null;s.forEach((o,i)=>{if(o.total!==last){p=i+1;last=o.total}o.pos=p})}
function note(m){S.msg=esc(m);render()}
function setLang(){L=L=="en"?"sw":"en";localStorage.lang=L;document.documentElement.lang=L;render()}

const ICON='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><circle cx="12" cy="11" r="1.6"/><path d="M12 12.6V15"/></svg>';
function shell(b){const m=S.msg?`<p class="msg">${S.msg}</p>`:"";
 if(!S.u)return `<div class="login"><div class="lbox"><div class="ic">${ICON}</div><h1>${esc(SCHOOL)}</h1><p class="sub">${t("app")}</p>${m}${b}<p class="c"><button class="lk" onclick="setLang()">${t("lang")}</button></p></div></div>`;
 return `<div class="app"><aside><b>${esc(SCHOOL)}</b>${tabs()}<button class="sp" onclick="setLang()">${t("lang")}</button><button onclick="auth.signOut()">${t("out")}</button></aside><main>${m}${b}</main></div>`}
function tabs(){const m={admin:[["dash","dash"],["lr","learners"],["cl","classes"],["att","attn"],["up","upload"],["tc","teachers"]],teacher:[["my","myc"],["att","attn"]],parent:[]}[S.role];return m.map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="S.tab='${k}';S.edit=null;render()">${t(l)}</button>`).join("")}
function render(){let b;
 if(!S.u)b=loginV();else if(S.role==="admin")b=S.tab=="dash"?dashV():S.tab=="up"?upV():S.tab=="lr"?lrV():S.tab=="cl"?clV():S.tab=="att"?attV():S.tab=="rp"?kidV(S.learners.find(l=>l.id==S.edit)||{}):tcV();
 else if(S.role==="teacher")b=S.tab=="att"?attV():myV();else b=S.learners.length?S.learners.map(kidV).join(""):linkV();
 app.innerHTML=shell(b);S.msg=""}
function dashV(){const L=S.learners,cl=[...new Set(L.map(l=>l.cls))].sort(),td=today(),pt=L.filter(l=>["P","L"].includes(l.att?.["d"+td.replace(/-/g,"")])).length,lt=L.reduce((n,l)=>n+(l.late||[]).filter(x=>x.d===td).length,0);
 return `<h1>${t("dash")}</h1><div class="tiles">${[["cnt_l",L.length],["cnt_c",cl.length],["cnt_t",S.teachers.length],["att_t",pt],["late_t",lt]].map(([k,v])=>`<div class="tile"><small>${t(k)}</small><b>${v}</b></div>`).join("")}</div>
<div class="panel"><h2>${t("learners")}</h2><div class="wrap"><table><tr><th>${t("adm")}<th>${t("name")}<th>${t("cls")}<th></tr>${L.slice(0,6).map(l=>`<tr><td>${esc(l.adm)}<td>${esc(l.name)}<td>${esc(l.cls)}<td><button onclick="S.tab='lr';S.edit='${l.id}';render()">${t("view")}</button></tr>`).join("")}</table></div></div>
<div class="panel"><h2>${t("byc")}</h2><div class="wrap"><table><tr><th>${t("cls")}<th>${t("learners")}<th>${t("late")}</tr>${cl.map(c=>{const k=L.filter(l=>l.cls===c);return `<tr><td>${esc(c)}<td>${k.length}<td>${k.reduce((n,l)=>n+(l.late||[]).length,0)}</tr>`}).join("")}</table></div></div>`}

function loginV(){return `<label>${t("idlab")}<input id="em" autocomplete="username" placeholder="name@mail.com / 0712345678 / 1042-K7P3Q"></label><label>${t("pw")}<input id="pw" type="password" autocomplete="current-password"></label><button class="p w" onclick="go(0)">${t("login")}</button><p class="c"><button class="lk" onclick="go(1)">${t("register")}</button></p>`}
async function go(reg){const v=$("#em").value.trim(),p=$("#pw").value;S.pend=reg&&kind(v)=="id"?v:null;
 try{reg?await auth.createUserWithEmailAndPassword(mail(v),p):await auth.signInWithEmailAndPassword(mail(v),p)}catch(x){S.pend=null;note(x.message)}}

async function load(){const c=db.collection("learners"),q=S.role==="parent"?c.where("parents","array-contains",S.u.uid):c;
 S.learners=(await q.get()).docs.map(d=>({id:d.id,...d.data()}));
 S.learners.sort((a,b)=>(a.cls+a.name).localeCompare(b.cls+b.name));
 if(S.role==="admin"){S.teachers=(await db.collection("teachers").get()).docs.map(d=>({id:d.id,...d.data()}));S.classes=(await db.collection("classes").get()).docs.map(d=>({id:d.id,...d.data()}))}}

/* ---------- admin: upload ---------- */
function upV(){const cl=[...new Set(S.learners.map(l=>l.cls))];
 return `<h1>${t("upload")}</h1><div class="row"><label>${t("cls")}<input id="uc" list="cl" placeholder="Grade 5"></label><datalist id="cl">${cl.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label>${t("term")}<input id="ut" placeholder="Term 1 2026"></label></div><label>${t("file")}<input id="uf" type="file" accept=".xlsx,.xls,.csv"></label><p><button class="p" onclick="check()">${t("check")}</button></p>`+(S.sheet?sheetV():"")}
async function check(){const f=$("#uf").files[0],cls=$("#uc").value.trim(),term=key($("#ut").value);
 if(!f||!cls||!term)return note(t("need"));
 if(S.role==="teacher"&&!(S.me.assign||[]).some(a=>a.cls===cls))return note(t("nf2"));
 const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 const ks=Object.keys(rows[0]||{}),K=re=>ks.find(k=>re.test(k)),ka=K(/adm|usajili/i),kn=K(/name|jina/i),kt=K(/total|jumla/i),kp=K(/pos|nafasi/i),subs=ks.filter(k=>![ka,kn,kt,kp].includes(k));
 const bad=[],seen=new Set(),ok=[];
 if(!ka||!kn||!subs.length)bad.push("Columns needed: Adm, Name, and one column per subject.");
 else rows.forEach((r,i)=>{const n=i+2,adm=String(r[ka]).trim().replace(/\W/g,""),nm=String(r[kn]).trim();
  if(!adm||!nm)return bad.push(`Row ${n}: missing admission number or name`);
  if(seen.has(adm))return bad.push(`Row ${n}: duplicate ${adm}`);seen.add(adm);
  const ex=S.learners.find(l=>l.cls===cls&&(l.adm===adm||l.name.toLowerCase()===nm.toLowerCase()));
  if(S.role==="teacher"&&!ex)return bad.push(`Row ${n}: ${nm} not found in ${cls}`);
  const m={};let sum=0,fine=true;
  subs.forEach(s=>{const v=r[s];if(v==="")return;const x=Number(v);if(isNaN(x)||x<0||x>100){bad.push(`Row ${n}: ${s} must be 0–100`);fine=false}else{m[key(s)]=x;sum+=x}});
  if(kt&&r[kt]!==""&&Number(r[kt])!==sum){bad.push(`Row ${n}: total ${r[kt]} does not match marks (${sum})`);fine=false}
  if(fine)ok.push({id:ex?.id,adm:ex?.adm||adm,name:nm,subjects:m,total:sum,pos:kp&&r[kp]!==""?Number(r[kp]):0})});
 if(ok.length&&!kp)ranks(ok);
 S.sheet={cls,term,ok,bad};render()}
function sheetV(){const s=S.sheet;
 return `<h2>${s.ok.length} ${t("rows")}</h2>`+(s.bad.length?`<p class="bad"><b>${t("bad")}</b></p>`+s.bad.slice(0,15).map(x=>`<p class="bad">${esc(x)}</p>`).join(""):"")+(s.ok.length?`<div class="wrap"><table><tr><th>${t("adm")}<th>${t("name")}<th>${t("total")}<th>${t("pos")}</tr>${s.ok.slice(0,8).map(o=>`<tr><td>${esc(o.adm)}<td>${esc(o.name)}<td>${o.total}<td>${o.pos}</tr>`).join("")}</table></div><p><button class="p" onclick="saveSheet()">${t("confirm")}</button></p>`:"")}
async function saveSheet(){const{cls,term,ok}=S.sheet,b=db.batch(),col=db.collection("learners"),TE=S.role==="teacher";
 ok.forEach(o=>{const R={subjects:o.subjects,total:o.total,pos:o.pos,n:ok.length};
  if(TE)return b.update(col.doc(o.id),{[`results.${term}`]:R});
  const ex=S.learners.find(l=>l.adm===o.adm),id=ex?ex.id:o.adm+"-"+rc();
  b.set(col.doc(id),{adm:o.adm,name:o.name,cls,...(ex?{}:{code:id.split("-")[1],parents:[],notes:{},late:[]}),results:{[term]:R}},{merge:true})});
 await b.commit();S.sheet=null;await load();if(!TE)S.tab="lr";note(t("ok"))}

/* ---------- admin: learners and teachers ---------- */
function lrV(){const q=S.q.toLowerCase(),L=S.learners.filter(l=>(l.name+l.adm+l.cls).toLowerCase().includes(q));
 return `<h1>${t("learners")}</h1>`+(S.edit?editV(S.learners.find(l=>l.id==S.edit)):"")+`<div class="panel"><div class="row"><label>${t("adm")}<input id="aa" placeholder="auto"></label><label>${t("name")}<input id="an"></label><label>${t("cls")}<input id="ac" list="cl2"></label><datalist id="cl2">${S.classes.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist></div><div class="row"><label>${t("gn")}<input id="gn"></label><label>${t("gp")}<input id="gp" type="tel"></label><button class="p" onclick="addL()">${t("add")}</button></div></div><label>${t("search")}<input value="${esc(S.q)}" onchange="S.q=this.value;render()"></label><div class="wrap"><table><tr><th>${t("adm")}<th>${t("name")}<th>${t("cls")}<th>${t("code")}<th></tr>${L.map(l=>`<tr><td>${esc(l.adm)}<td>${esc(l.name)}<td>${esc(l.cls)}<td>${esc(l.id)}<td><button onclick="S.edit='${l.id}';render()">${t("edit")}</button> <button onclick="S.tab='rp';S.edit='${l.id}';render()">${t("rep")}</button> <button onclick="delL('${l.id}')">×</button></tr>`).join("")}</table></div>`}
async function delL(id){if(confirm(t("sure"))){await db.collection("learners").doc(id).delete();S.edit=null;await load();render()}}
async function addL(){let adm=$("#aa").value.trim().replace(/\W/g,"");const name=$("#an").value.trim(),cls=$("#ac").value.trim();if(!name||!cls)return;
 if(!adm){let n=S.learners.length+1;do adm="STU"+new Date().getFullYear()+String(n++).padStart(4,"0");while(S.learners.some(l=>l.adm===adm))}
 if(S.learners.some(l=>l.adm===adm))return note("Admission number already exists.");
 const c=rc();await db.collection("learners").doc(adm+"-"+c).set({adm,name,cls,gn:$("#gn").value.trim(),gp:$("#gp").value.trim(),code:c,parents:[],results:{},notes:{},late:[],att:{}});await load();note(t("ok"))}
function tcV(){return `<h1>${t("teachers")}</h1><div class="row"><label>${t("name")}<input id="tn"></label><label>${t("email")}<input id="te" type="email"></label></div><label>${t("assign")}<input id="ta" placeholder="Grade 5:Math, Grade 6:English"></label><p><button class="p" onclick="addT()">${t("addt")}</button></p><div class="wrap"><table>${S.teachers.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.email)}<td>${(x.assign||[]).map(a=>esc(a.cls+" "+dsp(a.subject))).join("<br>")}<td>${x.clock?esc(x.clock.d+" "+x.clock.time)+(x.clock.late?` (${x.clock.late} ${t("min")})`:""):""}</tr>`).join("")}</table></div>`}
async function addT(){const em=$("#te").value.trim().toLowerCase();if(!em)return;
 const assign=$("#ta").value.split(",").map(s=>s.split(":")).filter(p=>p.length==2&&p[0].trim()&&p[1].trim()).map(([c,s])=>({cls:c.trim(),subject:key(s)}));
 await db.collection("teachers").doc(em).set({name:$("#tn").value.trim(),email:em,assign},{merge:true});await load();note(t("ok"))}

/* ---------- staff: notes, lateness ---------- */
function editV(l){if(!l)return "";const n=l.notes||{},ad=S.role==="admin";
 return `<div class="edit"><h2>${esc(l.name)} (${esc(l.cls)})</h2>`+(ad?`<div class="row"><label>${t("name")}<input id="e_n" value="${esc(l.name)}"></label><label>${t("cls")}<input id="e_c" value="${esc(l.cls)}"></label></div><div class="row"><label>${t("gn")}<input id="e_g" value="${esc(l.gn)}"></label><label>${t("gp")}<input id="e_p" value="${esc(l.gp)}"></label></div>`:"")+["acad","phys","mind"].map(k=>`<label>${t(k)}<textarea id="n_${k}" rows="2">${esc(n[k])}</textarea></label>`).join("")+`<div class="row"><button class="p" onclick="saveN('${l.id}')">${t("save")}</button><label>${t("mins")}<input id="lm" type="number" min="1"></label><button onclick="addLate('${l.id}')">${t("lateadd")}</button></div></div>`}
async function saveN(id){const d={notes:{acad:$("#n_acad").value,phys:$("#n_phys").value,mind:$("#n_mind").value}};

 return `<div class="panel"><h2>${t("upload")}</h2><p>${t("fmt")}</p><div class="row"><label>${t("cls")}<select id="uc">${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label><label>${t("term")}<input id="ut" placeholder="Term 1 2026"></label></div><label>${t("file")}<input id="uf" type="file" accept=".xlsx,.xls,.csv"></label><p><button class="p" onclick="check()">${t("check")}</button></p>${S.sheet?sheetV():""}</div>`}
function myV0(){const A=S.me.assign||[],a=A[S.ai],tm=key(S.term),ks=a?S.learners.filter(l=>l.cls===a.cls):[];
 return `<h1>${esc(S.me.name)}</h1><p><button onclick="clk()">${t("clock")}</button> ${S.me.clock?esc(S.me.clock.d+" "+S.me.clock.time)+(S.me.clock.late?` (${S.me.clock.late} ${t("min")})`:""):""}</p>`+(S.edit?editV(S.learners.find(l=>l.id==S.edit)):"")
 +`<div class="row"><label>${t("subj")}<select onchange="S.ai=+this.value;render()">${A.map((x,j)=>`<option value="${j}" ${j==S.ai?"selected":""}>${esc(x.cls+" "+dsp(x.subject))}</option>`).join("")}</select></label><label>${t("term")}<input id="mt" value="${esc(S.term)}" placeholder="Term 1 2026" onchange="S.term=this.value;render()"></label></div>`
 +(a?`<div class="wrap"><table>${ks.map((l,j)=>`<tr><td>${esc(l.name)}<td><input id="m${j}" type="number" min="0" max="100" value="${l.results?.[tm]?.subjects?.[a.subject]??""}"><td><button onclick="S.edit='${l.id}';render()">${t("edit")}</button></tr>`).join("")}</table></div><p><button class="p" onclick="saveM()">${t("save")}</button></p>`:`<p>${t("none")}</p>`)}

 const ks=S.learners.filter(l=>l.cls===a.cls),b=db.batch();
 ks.forEach((l,j)=>{const v=$("#m"+j).value,x=Number(v);if(v!==""&&x>=0&&x<=100)b.update(db.collection("learners").doc(l.id),{[`results.${tm}.subjects.${a.subject}`]:x})});
 await b.commit();await load();

 ranks(rk);const b2=db.batch();
 rk.forEach(r=>b2.update(db.collection("learners").doc(r.id),{[`results.${tm}.total`]:r.total,[`results.${tm}.pos`]:r.pos,[`results.${tm}.n`]:rk.length}));
 await b2.commit();await load();note(t("ok"))}
async function clk(){const n=new Date(),[h,m]=START.split(":"),late=Math.max(0,n.getHours()*60+n.getMinutes()-(+h*60+ +m)),c={d:today(),time:n.toTimeString().slice(0,5),late};
 await db.collection("teachers").doc(S.u.email.toLowerCase()).update({clock:c});S.me.clock=c;note(t("ok"))}

 const id=v.slice(0,i).replace(/\W/g,"")+"-"+v.slice(i+1).toUpperCase(),{data,error}=await sb.rpc("link_learner",{lid:id});

function kidV(l){const R=l.results||{},ts=Object.keys(R).sort(),cur=R[key(S.term)]?key(S.term):ts[ts.length-1],r=R[cur],n=l.notes||{},tot=ts.map(k=>R[k].total),mx=Math.max(...tot,1),d=tot.length>1?tot[tot.length-1]-tot[tot.length-2]:0;
 return `<h1>${esc(l.name)}</h1><p>${esc(l.cls)}, ${t("adm")} ${esc(l.adm)}</p>`
 +(r?`<div class="row"><label>${t("term")}<select onchange="S.term=this.value;render()">${ts.map(k=>`<option value="${k}" ${k==cur?"selected":""}>${esc(dsp(k))}</option>`).join("")}</select></label><div class="pos"><b>${r.pos||"-"}</b><span>${t("of")} ${r.n||"-"}</span></div></div>
 <h2>${t("marks")}</h2><div class="wrap"><table>${Object.entries(r.subjects||{}).map(([s,v])=>`<tr><td>${esc(dsp(s))}<td>${v}<td>${gr(v)}</tr>`).join("")}<tr><th>${t("total")}<th>${r.total}<th>${gr(r.total/Math.max(1,Object.keys(r.subjects||{}).length))}</tr></table></div>
 <h2>${t("trend")}: ${d>0?t("up"):d<0?t("down"):t("same")}</h2>${ts.map(k=>`<p>${esc(dsp(k))}: ${R[k].total}<span class="bar" style="display:block;width:${R[k].total/mx*100}%"></span></p>`).join("")}`:`<p>${t("none")}</p>`)
 +["acad","phys","mind"].map(k=>`<h2>${t(k)}</h2><p>${n[k]?esc(n[k]):t("none")}</p>`).join("")
 +attR(l)+`<h2>${t("late")}: ${(l.late||[]).length}</h2>`+(l.late||[]).slice(-5).map(x=>`<p>${esc(x.d)}: ${x.m} ${t("min")}</p>`).join("")+`<p class="np"><button class="p" onclick="window.print()">${t("prt")}</button></p>`}

function attR(l){const v=Object.values(l.att||{}),n=v.length,c=k=>v.filter(x=>x===k).length;return `<h2>${t("attn")}: ${n?Math.round((c("P")+c("L"))/n*100)+"%":"-"}</h2><p>${t("pres")} ${c("P")}, ${t("abs")} ${c("A")}, ${t("latee")} ${c("L")}</p>`}
function attV(){const cs=S.role==="admin"?[...new Set(S.learners.map(l=>l.cls))].sort():[...new Set((S.me.assign||[]).map(a=>a.cls))];
 const c=cs.includes(S.ac)?S.ac:cs[0];S.ac=c;const d=S.ad||today(),k="d"+d.replace(/-/g,""),ks=S.learners.filter(l=>l.cls===c),v=ks.map(l=>l.att?.[k]),n=x=>v.filter(y=>y===x).length;
 return `<h1>${t("attn")}</h1><div class="panel"><div class="row"><label>${t("cls")}<select onchange="S.ac=this.value;render()">${cs.map(x=>`<option ${x==c?"selected":""}>${esc(x)}</option>`).join("")}</select></label><label>${t("date")}<input type="date" value="${d}" onchange="S.ad=this.value;render()"></label></div>
<p>${t("pres")} ${n("P")}, ${t("abs")} ${n("A")}, ${t("latee")} ${n("L")}</p><p><button onclick="allA('P')">${t("allp")}</button> <button onclick="allA('A')">${t("alla")}</button></p>
<div class="wrap"><table>${ks.map((l,j)=>`<tr><td>${esc(l.name)}<td>${[["P","pres"],["A","abs"],["L","latee"]].map(([x,w])=>`<label style="display:inline;font-weight:normal;margin-right:.7rem"><input type="radio" style="width:auto" name="a${j}" value="${x}" ${(l.att?.[k]||"P")==x?"checked":""}> ${t(w)}</label>`).join("")}</tr>`).join("")}</table></div><p><button class="p" onclick="saveA()">${t("save")}</button></p></div>`}
function allA(x){document.querySelectorAll(`input[type=radio][value=${x}]`).forEach(r=>r.checked=true)}
async function saveA(){const k="d"+(S.ad||today()).replace(/-/g,""),b=db.batch();
 S.learners.filter(l=>l.cls===S.ac).forEach((l,j)=>{const r=document.querySelector(`input[name=a${j}]:checked`);if(r)b.update(db.collection("learners").doc(l.id),{["att."+k]:r.value})});
 await b.commit();await load();note(t("ok"))}
function clV(){return `<h1>${t("classes")}</h1><div class="panel"><div class="row"><label>${t("cls")}<input id="kc" placeholder="Grade 5 A"></label><label>${t("ctch")}<input id="kt"></label></div><div class="row"><label>${t("room")}<input id="kr"></label><label>${t("cap")}<input id="kp" type="number" min="1"></label><button class="p" onclick="addC()">${t("add")}</button></div></div><div class="wrap"><table><tr><th>${t("cls")}<th>${t("ctch")}<th>${t("room")}<th>${t("cap")}<th>${t("learners")}<th></tr>${S.classes.map(c=>`<tr><td>${esc(c.name)}<td>${esc(c.teacher)}<td>${esc(c.room)}<td>${esc(c.cap)}<td>${S.learners.filter(l=>l.cls===c.name).length}<td><button onclick="delC('${c.id}')">×</button></tr>`).join("")}</table></div>`}
async function addC(){const name=$("#kc").value.trim();if(!name)return;await db.collection("classes").doc(key(name)).set({name,teacher:$("#kt").value.trim(),room:$("#kr").value.trim(),cap:$("#kp").value});await load();note(t("ok"))}
async function delC(id){if(confirm(t("sure"))){await db.collection("classes").doc(id).delete();await load();render()}}

/* ---------- Supabase adapter ---------- */
const PK={learners:"id",teachers:"email",classes:"id"};
const DEF={learners:()=>({adm:"",name:"",cls:"",code:"",gn:"",gp:"",parents:[],results:{},notes:{},late:[],att:{}}),teachers:()=>({name:"",assign:[],clock:null}),classes:()=>({name:"",teacher:"",room:"",cap:""})};
const AU=x=>({__au:x}),cl=x=>JSON.parse(JSON.stringify(x??null));
function setP(o,path,v){const p=path.split(".");let c=o;for(const k of p.slice(0,-1))c=c[k]=c[k]&&typeof c[k]=="object"?c[k]:{};c[p[p.length-1]]=v}
function mrg(a,b){for(const k in b){const v=b[k];a[k]=v&&typeof v=="object"&&!Array.isArray(v)?mrg(a[k]&&typeof a[k]=="object"&&!Array.isArray(a[k])?a[k]:{},v):v}return a}
function apply(row,upd,ch){for(const[k,v]of Object.entries(upd)){const top=k.split(".")[0];ch.add(top);
 if(v&&v.__au){const a=Array.isArray(row[top])?row[top]:[];row[top]=a.some(y=>JSON.stringify(y)==JSON.stringify(v.__au))?a:[...a,v.__au]}
 else if(k.includes(".")){row[top]=cl(row[top])||{};setP(row,k,v)}else row[k]=v}}
async function run(ops){const by={};ops.forEach(o=>(by[o.c]=by[o.c]||[]).push(o));
 for(const c in by){const pk=PK[c],ids=[...new Set(by[c].map(o=>o.id))];
  const{data,error}=await sb.from(c).select("*").in(pk,ids);if(error)throw error;
  const cur={},ch={},del=[],ins=new Set();(data||[]).forEach(r=>cur[r[pk]]=r);
  for(const o of by[c]){if(o.k=="del"){del.push(o.id);continue}
   let row=cur[o.id];if(!row){if(o.k=="upd")throw new Error("Record not found");row=cur[o.id]={...DEF[c](),[pk]:o.id};ins.add(o.id)}
   const st=ch[o.id]=ch[o.id]||new Set();
   if(o.k=="set"){mrg(row,o.d);Object.keys(o.d).forEach(k=>st.add(k))}else apply(row,o.d,st)}
  const jobs=[],rows=[...ins].map(id=>cur[id]);
  if(rows.length)jobs.push(sb.from(c).insert(rows));
  Object.keys(ch).filter(id=>!ins.has(id)).forEach(id=>{const u={};ch[id].forEach(k=>u[k]=cur[id][k]);jobs.push(sb.from(c).update(u).eq(pk,id))});
  if(del.length)jobs.push(sb.from(c).delete().in(pk,del));
  for(const r of await Promise.all(jobs))if(r.error)throw r.error}}
function mkdb(){const doc=(c,id)=>({c,id,
  async get(){const{data,error}=await sb.from(c).select("*").eq(PK[c],id).maybeSingle();if(error)throw error;return{exists:!!data,id,data:()=>data||undefined}},
  set:(d)=>run([{c,id,k:"set",d}]),update:d=>run([{c,id,k:"upd",d}]),delete:()=>run([{c,id,k:"del"}])});
 const coll=(c,f)=>({doc:id=>doc(c,id),where:(fl,op,v)=>coll(c,q=>q.contains(fl,[v])),async get(){let q=sb.from(c).select("*");if(f)q=f(q);const{data,error}=await q;if(error)throw error;return{docs:(data||[]).map(r=>({id:r[PK[c]],data:()=>r}))}}});
 return{collection:c=>coll(c),batch:()=>{const ops=[];return{set(r,d){ops.push({c:r.c,id:r.id,k:"set",d})},update(r,d){ops.push({c:r.c,id:r.id,k:"upd",d})},delete(r){ops.push({c:r.c,id:r.id,k:"del"})},commit:()=>run(ops)}}}}
function mkauth(){let last;const mk=u=>u&&{uid:u.id,email:u.email};
 return{createUserWithEmailAndPassword:async(e,p)=>{const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)throw error;if(!data.session)throw new Error("Turn OFF Confirm email in Supabase: Authentication > Providers > Email.")},
 signInWithEmailAndPassword:async(e,p)=>{const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error},
 signOut:()=>sb.auth.signOut(),
 onAuthStateChanged:cb=>sb.auth.onAuthStateChange((ev,ses)=>{const id=ses?.user?.id||null;if(ev=="TOKEN_REFRESHED"||id===last)return;last=id;setTimeout(()=>cb(mk(ses?.user)),0)})}}

/* ---------- start ---------- */
document.documentElement.lang=L;
if(!SB_KEY){app.innerHTML=shell("<p>Add your Supabase URL and key at the top of this file (SB_URL and SB_KEY).</p>")}
else{sb=supabase.createClient(SB_URL,SB_KEY);auth=mkauth();db=mkdb();
 auth.onAuthStateChanged(async u=>{S.u=u;S.msg="";if(!u){S.role=null;return render()}
  try{const em=u.email.toLowerCase();
   if((await sb.rpc("is_admin")).data===true)S.role="admin";
   else{const d=await db.collection("teachers").doc(em).get();S.role=d.exists?"teacher":"parent";S.me=d.data()}
   await load();if(S.role==="parent"&&!S.learners.length&&S.pend){const v=S.pend;S.pend=null;await linkId(v)}S.tab={admin:"dash",teacher:"my"}[S.role];render()}catch(x){note(x.message)}});
 render()}
